packages:
  - apps/*
  - packages/*
  - templates/*
  - '!**/test/**'

catalog:
  '@commitlint/cli': ^21.2.3
  '@types/semver': ^7.8.0
  commander: ^15.0.0
  comment-json: ^5.0.0
  esbuild: ^0.28.2
  postcss: ^8.5.28
  semver: ^7.8.5
  stylelint: ^17.16.0
  vitest: ^5.0.3
  yaml: ^2.9.1

minimumReleaseAge: 0

pmOnFail: error

versioning:
  fixed:
    - ['@icebreakers/monorepo', repoctl]
  ignore:
    - '@icebreakers/client'
  changelog:
    storage: repository

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  vue-demi: true
  workerd: true
overrides:
  prettier: 3.9.9
  typescript: 6.0.3
  # ATTW relies on the compiler internals of its pinned TypeScript version.
  '@arethetypeswrong/core>typescript': 5.6.1-rc
  vite: 8.3.2
  postcss: 8.5.28
  postcss-selector-parser: 7.1.6
  js-yaml: 5.4.2
  nanoid: 6.0.1
  brace-expansion: 5.0.12
  # Older minimatch imports the CommonJS default; v5 only exports named functions.
  minimatch@<4>brace-expansion: 1.1.21
  minimatch@>=4 <10>brace-expansion: 2.1.7
  cross-spawn: 7.0.6
  adm-zip: 0.6.1
  uuid: 14.0.2
  esbuild: 0.28.2
