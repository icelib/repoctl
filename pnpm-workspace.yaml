packages:
  - apps/*
  - packages/*
  - templates/*
  - '!**/test/**'

catalog:
  '@commitlint/cli': ^21.2.4
  '@types/semver': ^7.8.0
  commander: ^15.0.0
  comment-json: ^5.0.0
  esbuild: ^0.28.2
  postcss: ^8.5.32
  semver: ^7.8.5
  stylelint: ^17.16.0
  vitest: ^5.0.5
  yaml: ^2.9.1

minimumReleaseAge: 0

pmOnFail: error

versioning:
  fixed:
    - ['@icebreakers/monorepo', repoctl]
  ignore:
    - '@icebreakers/client'
  changelog:
    storage: repository

allowBuilds:
  lefthook: true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  vue-demi: true
  workerd: true
overrides:
  prettier: 3.9.10
  typescript: 6.0.3
  # ATTW relies on the compiler internals of its pinned TypeScript version.
  '@arethetypeswrong/core>typescript': 5.9.3
  # astro2tsx uses the legacy WASM bridge with emnapi core 1.x.
  # Pin only that bridge's runtime; Rolldown's core/runtime 2.x pair must stay aligned.
  '@napi-rs/wasm-runtime@1.2.4>@emnapi/runtime': 1.11.3
  vite: 8.3.5
  postcss: 8.5.32
  postcss-selector-parser: 7.1.7
  js-yaml: 5.5.0
  nanoid: 6.0.2
  brace-expansion: 5.0.12
  # Older minimatch imports the CommonJS default; v5 only exports named functions.
  minimatch@<4>brace-expansion: 1.1.21
  minimatch@>=4 <10>brace-expansion: 2.1.7
  cross-spawn: 7.0.6
  adm-zip: 0.6.1
  uuid: 14.0.3
  esbuild: 0.28.2
