name: Release Intent Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  release-intent:
    name: Require release intent for publishable changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted release validation dependencies
        if: startsWith(github.head_ref, 'pnpm-release/') || startsWith(github.head_ref, 'release/pnpm-version')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: release-validation-tools
          persist-credentials: false

      - name: Set up the trusted validator runtime
        if: startsWith(github.head_ref, 'pnpm-release/') || startsWith(github.head_ref, 'release/pnpm-version')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Install the frozen base tools without lifecycle scripts
        if: startsWith(github.head_ref, 'pnpm-release/') || startsWith(github.head_ref, 'release/pnpm-version')
        working-directory: release-validation-tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --global corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate exact release preparation
        if: startsWith(github.head_ref, 'pnpm-release/') || startsWith(github.head_ref, 'release/pnpm-version')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/release-validation-tools/node_modules/.bin/repo" release validate-preparation \
            --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$BASE_REF" --json

      - name: Validate release intent presence
        if: ${{ !startsWith(github.head_ref, 'pnpm-release/') && !startsWith(github.head_ref, 'release/pnpm-version') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(mktemp)"
          trap 'rm -f "$changed_files"' EXIT
          if ! git diff --name-status --no-renames -z "$BASE_SHA" "$HEAD_SHA" -- > "$changed_files"; then
            echo "Unable to inspect the frozen PR changes; release intent validation failed." >&2
            exit 1
          fi

          publishable_changes=()
          has_release_intent=false
          while IFS= read -r -d '' status && IFS= read -r -d '' file; do
            case "$file" in
              packages/*/*)
                case "$file" in
                  */dist/*) ;;
                  *) publishable_changes+=("$file") ;;
                esac
                ;;
            esac
            case "$status:$file" in
              [AM]:.changeset/?*.md) has_release_intent=true ;;
            esac
          done < "$changed_files"

          if [ "${#publishable_changes[@]}" -eq 0 ]; then
            echo "No publishable package changes detected"
            exit 0
          fi

          if [ "$has_release_intent" = true ]; then
            echo "pnpm release intent detected"
            exit 0
          fi

          echo "Publishable package changes require a pnpm release intent in .changeset/*.md."
          echo "Create one with: pnpm change"
          echo
          echo "Changed files:"
          printf '%s\n' "${publishable_changes[@]}"
          exit 1
