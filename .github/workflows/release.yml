# repoctl-managed: release/v2
name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
      - next
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        required: true
        default: auto
        type: choice
        options:
          - auto
          - prepare
          - publish
          - publish-unpublished
          - reconcile
      package:
        description: Package used for unpublished-version recovery
        required: false
        type: string
      version:
        description: Version used for unpublished-version recovery
        required: false
        type: string
      dry-run:
        description: Preview release reconciliation without changes
        required: false
        default: false
        type: boolean

env:
  HUSKY: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0 --registry=https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Release Tooling
        run: pnpm run tooling:build

      - name: Run repo release CI
        env:
          GITHUB_TOKEN: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
          REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
        run: pnpm exec repo release ci

      - name: Preserve npm publish progress
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publish-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pnpm-publish-summary.json
            repoctl-publish-progress.json
          if-no-files-found: ignore
          retention-days: 14
