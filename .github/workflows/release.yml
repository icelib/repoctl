# repoctl-managed: release/v2
name: Release

on:
  # Source repository only: 03:17 Asia/Shanghai.
  schedule:
    - cron: '17 19 * * *'
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
      - next
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        required: true
        default: auto
        type: choice
        options:
          - auto
          - prepare
          - publish
          - publish-unpublished
          - reconcile
          - oidc-audit
          - nightly
          - bootstrap
      package:
        description: Exact package for recovery, OIDC audit or bootstrap
        required: false
        type: string
      version:
        description: Exact version for unpublished-version recovery or bootstrap
        required: false
        type: string
      dry-run:
        description: Preview reconciliation, nightly or bootstrap without changes
        required: false
        default: false
        type: boolean
      source-sha:
        description: Original main commit to recover (publish modes only)
        required: false
        type: string
      tag:
        description: Non-latest bootstrap dist-tag
        required: false
        default: alpha
        type: string
      verify-run-id:
        description: Verify an existing bootstrap publication without republishing
        required: false
        type: string

env:
  LEFTHOOK: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

permissions:
  actions: write
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'schedule' && inputs.mode != 'nightly' && inputs.mode != 'oidc-audit' && inputs.mode != 'bootstrap' }}
    name: Release
    runs-on: ubuntu-latest
    outputs:
      release-record: ${{ steps.release-finalize.outputs.release-record }}
      docs-sites: ${{ steps.release-finalize.outputs.docs-sites }}
    steps:
      - name: Validate GitHub App configuration
        env:
          APP_CLIENT_ID: ${{ vars.REPOCTL_APP_CLIENT_ID }}
          APP_PRIVATE_KEY_CONFIGURED: ${{ secrets.REPOCTL_APP_PRIVATE_KEY != '' }}
        run: |
          if { [ -n "$APP_CLIENT_ID" ] && [ "$APP_PRIVATE_KEY_CONFIGURED" != 'true' ]; } ||
             { [ -z "$APP_CLIENT_ID" ] && [ "$APP_PRIVATE_KEY_CONFIGURED" = 'true' ]; }; then
            echo 'Configure both REPOCTL_APP_CLIENT_ID and REPOCTL_APP_PRIVATE_KEY.' >&2
            exit 1
          fi

      - name: Create GitHub App token
        if: ${{ vars.REPOCTL_APP_CLIENT_ID != '' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REPOCTL_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPOCTL_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0 --registry=https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Release Tooling
        run: pnpm run tooling:build

      - name: Release plan
        id: release-plan
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
          REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          REPO_RELEASE_RECOVERY_SOURCE_SHA: ${{ inputs.source-sha }}
        run: pnpm exec repo release ci --stage plan

      - name: Release verify
        id: release-verify
        if: ${{ steps.release-plan.outputs.run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
          REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          REPO_RELEASE_RECOVERY_SOURCE_SHA: ${{ inputs.source-sha }}
        run: pnpm exec repo release ci --stage verify

      - name: Release prepare
        id: release-prepare
        if: ${{ steps.release-plan.outputs.run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
          REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          REPO_RELEASE_RECOVERY_SOURCE_SHA: ${{ inputs.source-sha }}
        run: pnpm exec repo release ci --stage prepare

      # Source repository only: GITHUB_TOKEN PR events do not trigger native PR checks.
      - name: Request Release PR approval
        id: pr-ci-approval
        if: ${{ steps.release-prepare.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_USES_EVENT_TOKEN: ${{ steps.app-token.outputs.token == '' && secrets.REPOCTL_RELEASE_TOKEN == '' && secrets.CHANGESETS_RELEASE_TOKEN == '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/pr-ci/index.mjs release

      - name: Release upload
        id: release-upload
        if: ${{ steps.release-prepare.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
          REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          REPO_RELEASE_RECOVERY_SOURCE_SHA: ${{ inputs.source-sha }}
        run: pnpm exec repo release ci --stage upload

      - name: Release confirm
        id: release-confirm
        if: ${{ steps.release-prepare.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
          REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          REPO_RELEASE_RECOVERY_SOURCE_SHA: ${{ inputs.source-sha }}
        run: pnpm exec repo release ci --stage confirm

      - name: Release finalize
        id: release-finalize
        if: ${{ steps.release-prepare.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
          REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          REPO_RELEASE_RECOVERY_SOURCE_SHA: ${{ inputs.source-sha }}
        run: pnpm exec repo release ci --stage finalize

      - name: Preserve npm publish progress
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-publish-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pnpm-publish-summary.json
            repoctl-publish-progress.json
            repoctl-release-progress.json
            repoctl-ci-progress.json
          if-no-files-found: ignore
          retention-days: 14

  docs:
    needs: release
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.release.outputs.release-record != '' && needs.release.outputs.docs-sites != '' && needs.release.outputs.docs-sites != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.release.outputs.docs-sites) }}
    uses: ./.github/workflows/repoctl-docs-deploy.yml
    with:
      site: ${{ matrix.site }}
      channel: stable
      release: ${{ needs.release.outputs.release-record }}
    secrets: inherit

  nightly:
    name: Publish nightly
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 19 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REPOCTL_NIGHTLY_PROVIDER: npm
      REPOCTL_NIGHTLY_SCHEDULE: '17 19 * * *'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate nightly source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo '::error::Nightly publication requires the repository default branch.'
            exit 1
          fi

      - name: Checkout nightly source
        id: nightly-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install npm with trusted publishing support
        id: nightly-npm
        run: npm install --global npm@11.16.0 --registry=https://registry.npmjs.org

      - name: Install Dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Release Tooling
        run: pnpm run tooling:build

      - name: Publish nightly packages
        id: nightly-publish
        env:
          REPOCTL_SNAPSHOT_PUBLISH: '1'
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
          REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          REPO_RELEASE_RECOVERY_SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          args=(--publish --output "$RUNNER_TEMP/repoctl-nightly" --json)
          if [ "$REPO_RELEASE_DRY_RUN" = 'true' ]; then
            args+=(--dry-run)
          fi
          pnpm exec repo release nightly "${args[@]}"

      - name: Preserve nightly diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repoctl-nightly/*.json
            ${{ runner.temp }}/repoctl-nightly/**/nightly-report.json
            ${{ runner.temp }}/repoctl-nightly/**/consumer-report.json
            ${{ runner.temp }}/repoctl-nightly/**/snapshot-report.json
            ${{ runner.temp }}/repoctl-nightly/**/tarballs/**/*.tgz
          if-no-files-found: ignore
          retention-days: 14

  oidc-audit:
    name: Audit npm OIDC
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'oidc-audit' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install Dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Release Tooling
        run: pnpm run tooling:build

      - name: Audit selected publishable packages
        env:
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
          REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          REPO_RELEASE_RECOVERY_SOURCE_SHA: ${{ inputs.source-sha }}
        run: pnpm exec repo release ci --mode oidc-audit

  bootstrap-prepare:
    name: Prepare bootstrap package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap' && inputs.verify-run-id == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout bootstrap source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install Dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Release Tooling
        run: pnpm run tooling:build

      - name: Prepare bootstrap package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_PACKAGE: ${{ inputs.package }}
          BOOTSTRAP_VERSION: ${{ inputs.version }}
          BOOTSTRAP_TAG: ${{ inputs.tag || 'alpha' }}
          BOOTSTRAP_DRY_RUN: ${{ inputs.dry-run }}
          BOOTSTRAP_SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          if [ -n "$BOOTSTRAP_SOURCE_SHA" ]; then
            echo 'Bootstrap does not accept source-sha recovery.' >&2
            exit 1
          fi
          args=(release bootstrap --stage prepare --package "$BOOTSTRAP_PACKAGE" --version "$BOOTSTRAP_VERSION" --tag "$BOOTSTRAP_TAG" --output "$RUNNER_TEMP/repoctl-bootstrap" --json)
          if [ "$BOOTSTRAP_DRY_RUN" = 'true' ]; then
            args+=(--dry-run)
          fi
          pnpm exec repo "${args[@]}"

      - name: Preserve bootstrap package
        if: ${{ !inputs.dry-run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repoctl-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repoctl-bootstrap/bootstrap-manifest.json
            ${{ runner.temp }}/repoctl-bootstrap/tarballs/
          if-no-files-found: error
          retention-days: 14

  bootstrap-publish:
    name: Publish bootstrap package
    needs: bootstrap-prepare
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap' && inputs.verify-run-id == '' && !inputs.dry-run && needs.bootstrap-prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      REPOCTL_BOOTSTRAP_TOOL_VERSION: 6.4.0
    steps:
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Install official bootstrap publisher
        id: bootstrap-tool
        run: npm install --prefix "$RUNNER_TEMP/repoctl-bootstrap-tool" --ignore-scripts --no-package-lock --no-audit --no-fund "repoctl@$REPOCTL_BOOTSTRAP_TOOL_VERSION" --registry=https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0 --registry=https://registry.npmjs.org

      - name: Publish bootstrap package
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_PACKAGE: ${{ inputs.package }}
          BOOTSTRAP_VERSION: ${{ inputs.version }}
          BOOTSTRAP_TAG: ${{ inputs.tag || 'alpha' }}
        run: node "$RUNNER_TEMP/repoctl-bootstrap-tool/node_modules/repoctl/bin/repo.js" release bootstrap --stage publish --package "$BOOTSTRAP_PACKAGE" --version "$BOOTSTRAP_VERSION" --tag "$BOOTSTRAP_TAG" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/repoctl-bootstrap-publication" --json

      - name: Preserve bootstrap publication evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repoctl-bootstrap-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repoctl-bootstrap-publication/
          if-no-files-found: error
          retention-days: 14

  bootstrap-verify:
    name: Verify bootstrap publication
    needs: [bootstrap-prepare, bootstrap-publish]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap' && !inputs.dry-run && (inputs.verify-run-id != '' || needs.bootstrap-publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      REPOCTL_BOOTSTRAP_TOOL_VERSION: 6.4.0
    steps:
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Install official bootstrap verifier
        id: bootstrap-tool
        run: npm install --prefix "$RUNNER_TEMP/repoctl-bootstrap-tool" --ignore-scripts --no-package-lock --no-audit --no-fund "repoctl@$REPOCTL_BOOTSTRAP_TOOL_VERSION" --registry=https://registry.npmjs.org

      - name: Verify existing bootstrap publication
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_PACKAGE: ${{ inputs.package }}
          BOOTSTRAP_VERSION: ${{ inputs.version }}
          BOOTSTRAP_TAG: ${{ inputs.tag || 'alpha' }}
          BOOTSTRAP_VERIFY_RUN_ID: ${{ inputs.verify-run-id || github.run_id }}
        run: node "$RUNNER_TEMP/repoctl-bootstrap-tool/node_modules/repoctl/bin/repo.js" release bootstrap --stage verify --package "$BOOTSTRAP_PACKAGE" --version "$BOOTSTRAP_VERSION" --tag "$BOOTSTRAP_TAG" --verify-run-id "$BOOTSTRAP_VERIFY_RUN_ID" --output "$RUNNER_TEMP/repoctl-bootstrap-verification" --json

      - name: Preserve bootstrap verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repoctl-bootstrap-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repoctl-bootstrap-verification/
          if-no-files-found: error
          retention-days: 14
