name: Release Intent Check

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      head_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-intent:
    name: Require release intent for publishable changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the trusted base validator
        if: startsWith(inputs.head_ref, 'pnpm-release/') || startsWith(inputs.head_ref, 'release/pnpm-version')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha }}
          path: release-validation-tools
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the trusted validator runtime
        if: startsWith(inputs.head_ref, 'pnpm-release/') || startsWith(inputs.head_ref, 'release/pnpm-version')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Build the validator from the frozen trusted base
        if: startsWith(inputs.head_ref, 'pnpm-release/') || startsWith(inputs.head_ref, 'release/pnpm-version')
        working-directory: release-validation-tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --global corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter repoctl... build

      - name: Validate the exact version preparation before granting an exemption
        if: startsWith(inputs.head_ref, 'pnpm-release/') || startsWith(inputs.head_ref, 'release/pnpm-version')
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/release-validation-tools/packages/monorepo/bin/repo.js" release validate-preparation \
            --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$BASE_REF" --json

      - name: Validate release intent presence
        if: ${{ !startsWith(inputs.head_ref, 'pnpm-release/') && !startsWith(inputs.head_ref, 'release/pnpm-version') }}
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          publishable_changes="$(printf '%s\n' "$changed_files" | \
            rg '^packages/[^/]+/' \
            | rg -v '/dist/' \
            || true)"

          if [ -z "$publishable_changes" ]; then
            echo "No publishable package changes detected"
            exit 0
          fi

          release_intents="$(printf '%s\n' "$changed_files" | rg '^\.changeset/.+\.md$' || true)"

          if [ -n "$release_intents" ]; then
            echo "pnpm release intent detected"
            exit 0
          fi

          echo "Publishable package changes require a pnpm release intent in .changeset/*.md."
          echo "Create one with: pnpm change"
          echo
          echo "Changed files:"
          printf '%s\n' "$publishable_changes"
          exit 1
