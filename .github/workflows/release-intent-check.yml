name: Release Intent Check

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      head_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-intent:
    name: Require release intent for publishable changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Skip generated release PRs
        if: startsWith(inputs.head_ref, 'pnpm-release/') || startsWith(inputs.head_ref, 'release/pnpm-version')
        run: echo "Generated pnpm release PR detected; skipping validation"

      - name: Validate release intent presence
        if: ${{ !startsWith(inputs.head_ref, 'pnpm-release/') && !startsWith(inputs.head_ref, 'release/pnpm-version') }}
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          publishable_changes="$(printf '%s\n' "$changed_files" | \
            rg '^packages/[^/]+/' \
            | rg -v '/dist/' \
            || true)"

          if [ -z "$publishable_changes" ]; then
            echo "No publishable package changes detected"
            exit 0
          fi

          release_intents="$(printf '%s\n' "$changed_files" | rg '^\.changeset/.+\.md$' || true)"

          if [ -n "$release_intents" ]; then
            echo "pnpm release intent detected"
            exit 0
          fi

          echo "Publishable package changes require a pnpm release intent in .changeset/*.md."
          echo "Create one with: pnpm change"
          echo
          echo "Changed files:"
          printf '%s\n' "$publishable_changes"
          exit 1
