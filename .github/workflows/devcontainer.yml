name: Dev Container

on:
  workflow_call:
    inputs:
      ref:
        description: Frozen PR merge commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  devcontainer:
    name: Linux ${{ matrix.arch }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Check Nimbus upgrade review
        run: pnpm check:nimbus-upgrade
      - name: Install and build source packages
        run: pnpm install --frozen-lockfile
      - name: Check packaged Dev Container
        env:
          DEVCONTAINER_SMOKE_ARCH: ${{ matrix.arch }}
        run: pnpm test:packaged-devcontainer
