name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Frozen PR merge commit to validate
        required: true
        type: string
    secrets:
      TURBO_TOKEN:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    # Preserve time for full validation and packaged checks on every platform.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.23.4, 24.22.1, 26.12.1]
    runs-on: ${{ matrix.os }}
    # Remote Caching enabled - configure TURBO_TOKEN and TURBO_TEAM in repository settings
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check Nimbus upgrade review
        run: pnpm check:nimbus-upgrade

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tracked build artifacts
        run: pnpm check:no-tracked-build-artifacts

      - name: Check CI/CD workflow contracts
        run: pnpm check:workflows

      - name: Security Audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        if: ${{ matrix.os != 'windows-latest' || matrix.node-version != '22.23.4' }}
        run: pnpm typecheck

      - name: Typecheck (Windows Node 22)
        if: ${{ matrix.os == 'windows-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm exec turbo run typecheck --concurrency=1

      - name: TSD
        run: pnpm tsd

      - name: Test
        run: pnpm test

      - name: Check Worker type generation from packaged templates
        run: pnpm test:worker-types

      - name: Install browser for packaged documentation checks
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Check packaged monorepo creation
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-create

      - name: Check packaged doctor
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-doctor

      - name: Check packaged documentation publication
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-docs

      - name: Check packaged Nimbus documentation
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-nimbus

      - name: Check packaged React application
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-react

      - name: Check packaged Next.js application
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-next

      - name: Check packaged Playwright capability
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-capability

      - name: Check packaged Storybook capability
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-storybook
      - name: Check packaged React component library
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-react-lib

      - name: Check packaged template author validation
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-template-validation

      - name: Check packaged remote template sources
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-template-sources

      - name: Check packaged component and route generators
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-generators

      - name: Check packaged organization presets
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm test:packaged-presets

      - name: Check packaged preset maintenance
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '24.22.1' }}
        run: pnpm test:packaged-maintenance-presets

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Check packaged typed template parameters
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.22.1'
        run: pnpm test:packaged-template-parameters
